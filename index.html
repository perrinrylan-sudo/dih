
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Key Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d19;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.header {
    text-align: center;
    padding: 22px;
    font-size: 27px;
    font-weight: bold;
    color: #4ba3ff;
    letter-spacing: 2px;
}

.cps {
    position: absolute;
    top: 22px;
    left: 25px;
    background: #17243a;
    padding: 13px 18px;
    border-radius: 10px;
}

.highscore {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #ffd34d;
}

.highscore h3 {
    font-size: 13px;
    margin: 0;
}

.highscore p {
    font-size: 27px;
    margin: 5px;
}

.leaderboard {
    position: absolute;
    top: 20px;
    right: 25px;
    background: #17243a;
    border: 1px solid #30435f;
    border-radius: 12px;
    padding: 15px;
    width: 190px;
}

.leaderboard h3 {
    text-align: center;
    color: #4ba3ff;
    margin-top: 0;
}

.leaderboard div {
    padding: 9px 3px;
    border-bottom: 1px solid #30435f;
    font-size: 14px;
}

.game {
    position: absolute;
    top: 47%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
}

.timer {
    font-size: clamp(70px, 12vw, 115px);
    font-weight: bold;
    color: #4ba3ff;
    text-shadow: 0 0 25px #1685ff66;
}

.status {
    margin: 20px;
    color: #aabbd1;
    font-size: 17px;
}

.keys {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 25px;
}

.key {
    width: 90px;
    height: 90px;
    background: #17243a;
    border: 2px solid #4775a8;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
}

.key.active {
    background: #087bff;
    box-shadow: 0 0 25px #087bff;
}

.key.bad {
    background: #d52d43;
    border-color: #ff6375;
}

button {
    padding: 12px 19px;
    margin: 5px;
    background: #167bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #3993ff;
}

.instructions {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #7889a4;
    font-size: 13px;
}

@media(max-width:600px) {
    .leaderboard {
        top: 140px;
        right: 8px;
        width: 140px;
    }

    .cps {
        left: 8px;
    }
}
</style>
</head>

<body>

<div class="header">TWO KEY CHALLENGE</div>

<div class="cps">
    CPS : <span id="cps">0.00</span>
</div>

<div class="highscore">
    <h3>PERSONAL HIGH SCORE</h3>
    <p id="highscore">0.00s</p>
</div>

<div class="leaderboard">
    <h3>🏆 TOP 3</h3>
    <div id="leaderboard"></div>
</div>

<div class="game">

    <div class="timer" id="timer">0.00</div>

    <div class="status" id="status">
        Press either key to start!
    </div>

    <div class="keys">
        <div class="key" id="key1">W</div>
        <div class="key" id="key2">/</div>
    </div>

    <button onclick="chooseKey(0)">CHANGE KEY 1</button>
    <button onclick="chooseKey(1)">CHANGE KEY 2</button>
    <br>
    <button onclick="resetGame()">RESET GAME</button>

</div>

<div class="instructions">
    Alternate between your two keys. Never press the same key twice!
</div>

<script>

let keys = ["w", "/"];
let pressed = new Set();

let running = false;
let startTime = 0;
let animation;

let lastKey = null;
let choosing = -1;
let keyTimes = [];

let highScore =
    Number(localStorage.getItem("twoKeyHighScore")) || 0;

let leaderboard =
    JSON.parse(localStorage.getItem("twoKeyLeaderboard") || "[]");

const timer = document.getElementById("timer");
const status = document.getElementById("status");

document.getElementById("highscore").textContent =
    highScore.toFixed(2) + "s";

function displayKeys() {
    document.getElementById("key1").textContent =
        keys[0].toUpperCase();

    document.getElementById("key2").textContent =
        keys[1].toUpperCase();
}

function chooseKey(index) {
    if (running) return;

    choosing = index;
    status.textContent =
        "Press a key to set Key " + (index + 1);
}

function startGame() {
    running = true;
    startTime = performance.now();

    status.textContent = "KEEP ALTERNATING!";

    function updateTimer() {
        if (!running) return;

        let elapsed = (performance.now() - startTime) / 1000;

        timer.textContent = elapsed.toFixed(2);

        animation = requestAnimationFrame(updateTimer);
    }

    updateTimer();
}

function loseGame(reason) {
    if (!running) return;

    running = false;

    cancelAnimationFrame(animation);

    let finalTime =
        (performance.now() - startTime) / 1000;

    timer.textContent = "0.00";

    status.textContent =
        "GAME OVER! " + reason +
        " | TIME: " + finalTime.toFixed(2) + "s";

    if (finalTime > highScore) {
        highScore = finalTime;

        localStorage.setItem(
            "twoKeyHighScore",
            highScore
        );

        document.getElementById("highscore").textContent =
            highScore.toFixed(2) + "s";
    }

    saveScore(finalTime);

    pressed.clear();
    lastKey = null;

    updateKeysVisual();
}

function saveScore(score) {
    leaderboard.push(score);

    leaderboard.sort((a, b) => b - a);

    leaderboard = leaderboard.slice(0, 3);

    localStorage.setItem(
        "twoKeyLeaderboard",
        JSON.stringify(leaderboard)
    );

    displayLeaderboard();
}

function displayLeaderboard() {
    const board = document.getElementById("leaderboard");

    board.innerHTML = "";

    for (let i = 0; i < 3; i++) {
        let div = document.createElement("div");

        div.textContent =
            (i + 1) + ". " +
            (leaderboard[i] !== undefined
                ? leaderboard[i].toFixed(2) + "s"
                : "---");

        board.appendChild(div);
    }
}

function updateKeysVisual() {
    document.getElementById("key1").classList.toggle(
        "active", pressed.has(keys[0])
    );

    document.getElementById("key2").classList.toggle(
        "active", pressed.has(keys[1])
    );
}

function updateCPS() {
    let now = performance.now();

    keyTimes = keyTimes.filter(
        time => now - time < 1000
    );

    document.getElementById("cps").textContent =
        keyTimes.length.toFixed(2);
}

document.addEventListener("keydown", function(event) {

    if (event.repeat) return;

    let key = event.key.toLowerCase();

    if (key === " ") event.preventDefault();

    if (choosing !== -1) {

        if (
            key.length !== 1 ||
            key === keys[1 - choosing]
        ) {
            status.textContent = "Choose a different key!";
            return;
        }

        keys[choosing] = key;
        choosing = -1;

        displayKeys();

        status.textContent = "Press either key to start!";
        return;
    }

    if (!keys.includes(key)) return;

    keyTimes.push(performance.now());
    updateCPS();

    // Detect both keys pressed simultaneously
    if (pressed.has(keys[0]) || pressed.has(keys[1])) {

        pressed.add(key);
        updateKeysVisual();

        if (pressed.has(keys[0]) && pressed.has(keys[1])) {
            loseGame("BOTH KEYS PRESSED TOGETHER!");
        }

        return;
    }

    if (!running) {
        startGame();
        lastKey = key;
        pressed.add(key);
        updateKeysVisual();
        return;
    }

    // Detect pressing the same key twice consecutively
    if (key === lastKey) {
        pressed.add(key);
        loseGame("SAME KEY TWICE!");
        return;
    }

    lastKey = key;

    pressed.add(key);
    updateKeysVisual();

});

document.addEventListener("keyup", function(event) {

    let key = event.key.toLowerCase();

    pressed.delete(key);

    updateKeysVisual();

});

function resetGame() {

    running = false;

    cancelAnimationFrame(animation);

    pressed.clear();
    lastKey = null;
    choosing = -1;

    timer.textContent = "0.00";

    status.textContent = "Press either key to start!";

    updateKeysVisual();
}

setInterval(updateCPS, 100);

displayKeys();
displayLeaderboard();

</script>

</body>
</html>
